name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forum
          POSTGRES_PASSWORD: forum
          POSTGRES_DB: forum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forum -d forum"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://forum:forum@localhost:5432/forum?schema=public
      # Chave só para o CI (nunca a mesma de produção).
      SECRET_KEY: O0eFuzqbYCTGi3yPnVE6CyoQm8dBPnfjGE2sT4n5RcJVbQ70
      API_URL: http://localhost:3000

    steps:
      - name: Checkout do front
        uses: actions/checkout@v4

      - name: Checkout da API (LuizDevExe/nest-api)
        uses: actions/checkout@v4
        with:
          repository: LuizDevExe/nest-api
          # TODO: trocar para "master" assim que os PRs da API (base/front-apoio) forem mergeados.
          ref: ${{ vars.API_REF || 'front-apoio' }}
          path: api

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Subir a API
        working-directory: api
        env:
          PORT: 3000
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          node dist/main &
          timeout 60 bash -c 'until curl -sf http://localhost:3000/api -o /dev/null; do sleep 1; done'

      - name: Instalar dependências do front
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes unitários (vitest)
        run: npx vitest run

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes e2e (Playwright, contra a API real)
        run: npx playwright test

      - name: Subir o relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
